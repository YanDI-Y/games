<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅</title>
<style>
  :root {
    --bg-top: #1c1c1c;
    --bg-bottom: #040404;
    --panel: #161616;
    --panel-edge: #303030;
    --card-hover: #202020;
    --text: #d0d0d0;
    --text-dim: #a9a9a9;
    --text-faint: #6f6f6f;
    --hi: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 40%, transparent 50%, rgba(0,0,0,.72) 100%),
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.06), transparent 55%),
      radial-gradient(circle at 50% 25%, var(--bg-top), var(--bg-bottom));
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    padding: 32px 16px;
  }

  h1 {
    margin: 0 0 6px;
    font-weight: 600;
    letter-spacing: 10px;
    font-size: 28px;
    color: var(--text-dim);
    text-shadow: 0 0 24px rgba(255,255,255,.22), 0 2px 3px rgba(0,0,0,.8);
  }

  .subtitle {
    margin: 0 0 30px;
    font-size: 13px;
    color: var(--text-faint);
    letter-spacing: 3px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 640px;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 26px 20px 22px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    text-decoration: none;
    color: var(--text);
    transition: transform .15s, border-color .2s, box-shadow .25s, background .2s;
  }
  .card:hover {
    transform: translateY(-3px);
    background: var(--card-hover);
    border-color: #4a4a4a;
    box-shadow: 0 12px 34px rgba(0,0,0,.6), 0 0 26px rgba(255,255,255,.08);
  }
  .card:active { transform: translateY(-1px); }

  .icon {
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    background: #0f0f0f;
    box-shadow: inset 0 0 14px rgba(0,0,0,.7);
    overflow: hidden;
  }

  .icon-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 14px;
    display: block;
  }

  .card .name {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--hi);
  }

  .card .desc {
    font-size: 12.5px;
    color: var(--text-faint);
    text-align: center;
    line-height: 1.6;
  }

  .card .go {
    margin-top: 2px;
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 1px;
    opacity: 0;
    transform: translateY(3px);
    transition: opacity .2s, transform .2s;
  }
  .card:hover .go { opacity: 1; transform: translateY(0); }

  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 2px;
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    h1 { letter-spacing: 6px; }
  }
</style>
</head>
<body>
  <h1>游戏大厅</h1>
  <div class="subtitle">选择一个游戏开始</div>

  <div class="grid" id="grid"></div>

  <div class="footer">更多游戏陆续添加中 …</div>

    title: '2048',

    icon: '🔢',
    desc: '经典数字合成 · 合并相同数字，挑战 2048',
  },

const grid = document.getElementById('grid');

function render() {
  grid.innerHTML = '';
  for (const g of GAMES) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.file;

    const icon = document.createElement('div');
    icon.className = 'icon';
    if (g.icon.startsWith('data:')) {
      const img = document.createElement('img');
      img.className = 'icon-img';
      img.src = g.icon;
      img.alt = g.title;
      icon.appendChild(img);
    } else {
      icon.textContent = g.icon;
    }

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = g.title;

    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = g.desc;

    const go = document.createElement('div');
    go.className = 'go';
    go.textContent = '进入 →';

    a.appendChild(icon);
    a.appendChild(name);
    a.appendChild(desc);
    a.appendChild(go);
    grid.appendChild(a);
  }
}

render();
