<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日月棋</title>
<style>
  :root {
    --cell: 84px;
    --bg-top: #1c1c1c;
    --bg-bottom: #040404;
    --moonlight: rgba(255,255,255,.06);
    --vignette: rgba(0,0,0,.72);
    --panel: #161616;
    --panel-edge: #303030;
    --stone-a: #3d3d3d;   /* 暗砖 亮面 */
    --stone-b: #1f1f1f;   /* 暗砖 暗面 */
    --stone-dark: #0f0f0f;
    --moon-sym: #9c9c9c;  /* 月亮刻痕 */
    --sun-a: #eaeaea;     /* 亮砖 亮面 */
    --sun-b: #bdbdbd;     /* 亮砖 暗面 */
    --sun-sym: #262626;   /* 太阳刻痕 */
    --sun-glow: rgba(255,255,255,.55);
    --btn-bg: #232323;
    --btn-hover: #303030;
    --btn-active: #d0d0d0;
    --counter-bg: #0a0a0a;
    --text: #d0d0d0;
    --text-dim: #a9a9a9;
    --text-faint: #6f6f6f;
    --hi: #ffffff;        /* 高强调文本 */
    --warn: #c07a7a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 52%, var(--vignette) 100%),
      radial-gradient(circle at 50% 0%, var(--moonlight), transparent 55%),
      radial-gradient(circle at 50% 25%, var(--bg-top), var(--bg-bottom));
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    padding: 16px;
  }

  h1 {
    margin: 0 0 4px;
    font-weight: 600;
    letter-spacing: 8px;
    font-size: 24px;
    color: var(--text-dim);
    text-shadow: 0 0 22px rgba(255,255,255,.22), 0 2px 3px rgba(0,0,0,.8);
  }

  .subtitle {
    margin: 0 0 14px;
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 3px;
  }

  .mode {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .mode button {
    padding: 6px 16px;
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    cursor: pointer;
    font-size: 14px;
    background: var(--btn-bg);
    color: var(--text-dim);
    transition: background .15s, transform .05s;
  }
  .mode button:hover { background: var(--btn-hover); }
  .mode button:active { transform: translateY(1px); }
  .mode button.active { background: var(--btn-active); color: #111; border-color: transparent; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--text-faint);
  }

  .parline { color: var(--hi); }

  .bestline {
    margin: 0 0 10px;
    font-size: 13px;
    color: var(--text-faint);
    text-align: center;
  }

  .hud {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    font-size: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .msg {
    min-height: 22px;
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.6;
  }
  .msg.strong { color: var(--hi); }
  .msg.warn { color: var(--warn); }

  .counter {
    background: var(--counter-bg);
    color: #e0e0e0;
    font-family: "Consolas", monospace;
    font-weight: bold;
    font-size: 20px;
    padding: 4px 12px;
    border-radius: 3px;
    min-width: 64px;
    text-align: center;
    letter-spacing: 1px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.7);
  }
  .counter.time { color: #c8c8c8; }
  .counter.moves { color: #ffffff; }

  .reset-btn {
    width: 42px;
    height: 42px;
    font-size: 22px;
    border: 1px solid rgba(0,0,0,.5);
    border-radius: 3px;
    background: var(--btn-active);
    color: #111;
    cursor: pointer;
    line-height: 1;
    transition: transform .1s;
    box-shadow: 0 0 12px rgba(255,255,255,.25), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .reset-btn:hover { transform: scale(1.06); }
  .reset-btn:active { transform: scale(0.95); }

  .hint-btn, .solve-btn, .theme-btn {
    height: 42px;
    padding: 0 14px;
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    font-size: 15px;
    background: var(--btn-bg);
    color: var(--text-dim);
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  .hint-btn:hover, .solve-btn:hover, .theme-btn:hover { background: var(--btn-hover); }
  .hint-btn:active, .solve-btn:active { background: var(--btn-active); color: #111; }
  .hint-btn.active, .solve-btn.active { background: var(--btn-active); color: #111; border-color: transparent; }
  .hint-btn:disabled, .solve-btn:disabled { opacity: .4; cursor: not-allowed; }

  .board {
    display: inline-grid;
    grid-template-columns: repeat(3, var(--cell));
    gap: 9px;
    padding: 14px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.3)),
      var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 4px;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,.6),
      0 12px 40px rgba(0,0,0,.75),
      0 0 60px rgba(255,255,255,.04);
    touch-action: manipulation;
  }

  body.editing .board { outline: 2px dashed var(--btn-active); outline-offset: 3px; }

  .cell {
    width: var(--cell);
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 2px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: box-shadow .2s, transform .15s;
  }

  /* 月亮石砖（暗）—— 未点亮 */
  .cell.back {
    background-color: var(--stone-b);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.06),
      inset 2px 2px 5px rgba(0,0,0,.6),
      inset -1px -1px 2px rgba(0,0,0,.4),
      0 2px 4px rgba(0,0,0,.6);
  }

  /* 太阳石砖（亮）—— 已点亮 */
  .cell.front {
    background-color: var(--sun-b);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.8),
      inset 2px 2px 5px rgba(0,0,0,.18),
      0 0 20px var(--sun-glow),
      0 2px 4px rgba(0,0,0,.5);
  }

  .cell:hover { filter: brightness(1.12); }

  .cell.pop { animation: pop .22s ease; }
  @keyframes pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(0.82); }
    100% { transform: scale(1); }
  }

  /* 高亮：双层白+黑描边，亮暗砖上皆清晰 */
  .cell.hint { animation: hintPulse .9s ease-in-out infinite; }
  @keyframes hintPulse {
    0%, 100% { box-shadow: 0 0 0 3px #fff, 0 0 0 6px rgba(0,0,0,.65), 0 0 12px rgba(255,255,255,.55); }
    50%      { box-shadow: 0 0 0 5px #fff, 0 0 0 8px rgba(0,0,0,.65), 0 0 24px rgba(255,255,255,.95); }
  }

  body.won .cell.front { animation: wonGlow 1.3s ease-in-out infinite; }
  @keyframes wonGlow {
    0%, 100% { box-shadow: 0 0 16px rgba(255,255,255,.6); }
    50%      { box-shadow: 0 0 34px rgba(255,255,255,1); }
  }

  .setupbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    font-size: 14px;
    color: var(--text-dim);
    flex-wrap: wrap;
    justify-content: center;
  }
  .setupbar .count { color: var(--hi); }
  .setupbar button {
    height: 38px;
    padding: 0 14px;
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    font-size: 14px;
    cursor: pointer;
    background: var(--btn-bg);
    color: var(--text-dim);
    transition: background .15s, transform .05s;
  }
  .setupbar button:hover { background: var(--btn-hover); }
  .setupbar button:active { transform: translateY(1px); }
  .setupbar button.primary { background: var(--btn-active); color: #111; font-weight: 700; border-color: transparent; }
  .setupbar button.primary:hover { background: var(--btn-active); filter: brightness(1.05); }
  .setupbar button.primary:disabled { opacity: .4; cursor: not-allowed; }

  .hidden { display: none !important; }

  .tip {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-faint);
    text-align: center;
    line-height: 1.8;
  }

  /* —— 昼间（高调灰） —— */
  body.light {
    --bg-top: #e4e4e4;
    --bg-bottom: #bdbdbd;
    --moonlight: rgba(255,255,255,.7);
    --vignette: rgba(0,0,0,.12);
    --panel: #d3d3d3;
    --panel-edge: #8f8f8f;
    --btn-bg: #c6c6c6;
    --btn-hover: #b9b9b9;
    --btn-active: #3a3a3a;
    --counter-bg: #c9c9c9;
    --text: #2a2a2a;
    --text-dim: #4a4a4a;
    --text-faint: #6f6f6f;
    --hi: #111111;
    --warn: #a04040;
  }
  body.light .reset-btn { background: var(--btn-active); color: #eee; }
  body.light .mode button.active,
  body.light .hint-btn.active,
  body.light .solve-btn.active { color: #eee; }
  body.light .setupbar button.primary { background: var(--btn-active); color: #eee; }
  body.light .counter.moves { color: #111; }
  body.light .counter.time { color: #2a2a2a; }
  .back-home {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 9999;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    font-size: 14px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px;
    background: rgba(16,16,16,.55);
    color: #dcdcdc;
    text-decoration: none;
    letter-spacing: 1px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background .15s, transform .05s;
  }
  .back-home:hover { background: rgba(30,30,30,.8); }
  .back-home:active { transform: translateY(1px); }

  .win-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .win-overlay.hidden { display: none; }
  .win-box {
    background: var(--panel);
    border: 1px solid #4a4a4a;
    border-radius: 12px;
    padding: 30px 26px;
    text-align: center;
    max-width: 340px;
    width: calc(100% - 40px);
    box-shadow: 0 16px 50px rgba(0,0,0,.7);
  }
  .win-symbol { font-size: 42px; margin-bottom: 10px; }
  .win-title { font-size: 22px; font-weight: 600; color: var(--hi); letter-spacing: 2px; margin-bottom: 10px; }
  .win-sub { font-size: 14px; color: var(--text-dim); margin-bottom: 22px; line-height: 1.7; }
  .win-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .win-actions button {
    padding: 9px 18px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  .win-primary { background: var(--btn-active); color: #161616; font-weight: 600; }
  .win-primary:hover { filter: brightness(1.1); }
  .win-secondary { background: var(--btn-bg); color: var(--text-dim); }
  .win-secondary:hover { background: var(--btn-hover); }
</style>
</head>
<body>
  <a class="back-home" href="index.html">← 返回大厅</a>
  <h1>日月棋</h1>
  <div class="subtitle">翻转石砖，点亮所有太阳</div>

  <div class="mode">
    <button data-mode="random" class="active">随机</button>
    <button data-mode="custom">自定义</button>
  </div>

  <div class="toolbar">
    <span class="parline" id="parLine"></span>
    <button class="theme-btn" id="themeBtn" title="切换昼/夜主题">昼</button>
  </div>

  <div class="bestline" id="bestLine"></div>

  <div class="hud">
    <div class="counter moves" id="moveCounter">000</div>
    <button class="reset-btn" id="resetBtn" title="重新开始">⟳</button>
    <button class="hint-btn" id="hintBtn" title="提示一步">✦ 提示</button>
    <button class="solve-btn" id="solveBtn" title="显示完整最优解">◎ 求解</button>
    <div class="counter time" id="timer">000</div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="board" id="board"></div>

  <div class="setupbar hidden" id="setupBar">
    <span class="count" id="setupCount">编辑局面：太阳 0 / 9 格</span>
    <button id="clearBtn" title="全部翻到月亮">全月</button>
    <button id="randomizeBtn" title="随机排布太阳">随机排布</button>
    <button class="primary" id="startBtn" title="以当前局面开始游戏">▶ 开始游戏</button>
  </div>

  <div class="win-overlay hidden" id="winOverlay">
    <div class="win-box">
      <div class="win-symbol">🚪</div>
      <div class="win-title">谜题解开，大门开启</div>
      <div class="win-sub" id="winSub"></div>
      <div class="win-actions">
        <button class="win-primary" id="winAgain">再玩一局</button>
        <button class="win-secondary" id="winClose">关闭</button>
      </div>
    </div>
  </div>

  <div class="tip">
    点击石砖：翻转自身与上下左右（太阳 ↔ 月亮）· 全部点亮为太阳即通关<br>
    随机＝自动生成 · 自定义＝点石砖设定太阳的位置与数量<br>
    ✦ 提示＝下一步 · ◎ 求解＝完整最优解（白色高亮框）

  function setMsg(text, kind) {
    msgEl.textContent = text;
    msgEl.className = 'msg' + (kind ? ' ' + kind : '');
  }

  // —— 构建 3×3 翻转矩阵 M：M[i][j]=1 表示按第 j 格会翻转第 i 格 ——
  function neighborsOf(i) {
    const r = (i / N) | 0, c = i % N;
    const list = [i];
    if (r > 0) list.push(i - N);
    if (r < N - 1) list.push(i + N);
    if (c > 0) list.push(i - 1);
    if (c < N - 1) list.push(i + 1);
    return list;
  }

  const M = [];
  for (let i = 0; i < TOTAL; i++) {
    M[i] = new Array(TOTAL).fill(0);
    for (const j of neighborsOf(i)) M[i][j] = 1;
  }

  // —— 高斯消元（GF(2)）求解 M·x = b，返回按下向量 x（0/1）——
  function gaussSolve(b) {
    const n = TOTAL;
    const a = [];
    for (let i = 0; i < n; i++) {
      a[i] = M[i].slice();
      a[i].push(b[i]);
    }
    for (let col = 0; col < n; col++) {
      let pivot = -1;
      for (let r = col; r < n; r++) if (a[r][col]) { pivot = r; break; }
      if (pivot === -1) continue;
      if (pivot !== col) [a[col], a[pivot]] = [a[pivot], a[col]];
      for (let r = 0; r < n; r++) {
        if (r !== col && a[r][col]) {
          for (let k = col; k <= n; k++) a[r][k] ^= a[col][k];
        }
      }
    }
    const x = new Array(n);
    for (let i = 0; i < n; i++) x[i] = a[i][n];
    return x;
  }

  // 当前局面 → 目标(全太阳) 的最优按下方案；3×3 矩阵满秩，解唯一
  function computeSolution(st) {
    const b = st.map(s => (s ? 0 : 1)); // 需要翻转的格子 = 当前为月亮的格子
    return gaussSolve(b);
  }

  function countOnes(arr) { return arr.reduce((s, v) => s + (v ? 1 : 0), 0); }

  // —— 生成随机初始局面：保证不是已解、且最少步数 ≥ 3 ——
  function randomState() {
    for (let attempt = 0; attempt < 200; attempt++) {
      const st = new Array(TOTAL).fill(false).map(() => Math.random() < 0.5);
      const mm = countOnes(computeSolution(st));
      if (mm >= 3) return { st, mm };
    }
    const st = new Array(TOTAL).fill(false).map(() => Math.random() < 0.5);
    return { st, mm: countOnes(computeSolution(st)) };
  }

  function buildBoard() {
    boardEl.innerHTML = '';
    cells = [];
    for (let i = 0; i < TOTAL; i++) {
      const el = document.createElement('div');
      el.className = 'cell back';
      el.dataset.i = i;
      boardEl.appendChild(el);
      cells.push(el);
    }
  }

  function renderCell(i, animate) {
    const el = cells[i];
    el.classList.toggle('front', state[i]);
    el.classList.toggle('back', !state[i]);
    el.style.backgroundImage = state[i] ? SUN_BG : MOON_BG;
    if (animate) {
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    }
  }

  function renderAll() {
    for (let i = 0; i < TOTAL; i++) renderCell(i, false);
  }

  function updateMoveCounter() {
    moveCounterEl.textContent = String(Math.min(999, moves)).padStart(3, '0');
  }

  function setEditing(on) {
    editing = on;
    document.body.classList.toggle('editing', on);
    setupBarEl.classList.toggle('hidden', !on);
    hintBtn.disabled = on;
    solveBtn.disabled = on;
  }

  // —— 提示 / 求解：按当前局面实时重算最优解并高亮 ——
  function clearHints() {
    cells.forEach(el => el.classList.remove('hint'));
  }

  function updateHints() {
    clearHints();
    if (gameOver || hintMode === 'off') return;
    const sol = computeSolution(state);
    const idx = [];
    for (let i = 0; i < TOTAL; i++) if (sol[i]) idx.push(i);

    if (hintMode === 'one') {
      if (idx.length === 0) return;
      const i = idx[0];
      cells[i].classList.add('hint');
      const r = (i / N | 0) + 1, c = i % N + 1;
      setMsg(`✦ 提示：按 (${r},${c}) 这块砖，它是最优解的一步（共 ${countOnes(sol)} 步）`, 'strong');
    } else { // all
      idx.forEach(i => cells[i].classList.add('hint'));
      setMsg(`◎ 完整最优解：高亮石砖各按一次，共 ${idx.length} 步`, 'strong');
    }
  }

  function toggleCell(i) {
    if (gameOver || editing) return;
    for (const a of neighborsOf(i)) {
      state[a] = !state[a];
      renderCell(a, true);
    }
    playBrick();
    moves++;
    updateMoveCounter();
    if (hintMode !== 'off') updateHints();
    checkWin();
  }

  // 编辑态：单击只翻转该格（不带动相邻格）
  function toggleEditCell(i) {
    state[i] = !state[i];
    renderCell(i, true);
    updateSetupCount();
  }

  function updateSetupCount() {
    const front = countOnes(state);
    if (front === TOTAL) {
      setupCountEl.textContent = '编辑局面：已全太阳（请留至少 1 格月亮）';
      startBtn.disabled = true;
    } else {
      const mm = countOnes(computeSolution(state));
      setupCountEl.textContent = `编辑局面：太阳 ${front} / 9 格 · 最少 ${mm} 步可解`;
      startBtn.disabled = false;
    }
  }

  function checkWin() {
    if (state.every(s => s)) { win(); return true; }
    return false;
  }

  function win() {
    gameOver = true;
    stopTimer();
    hintMode = 'off';
    clearHints();
    resetBtn.textContent = '★';
    document.body.classList.add('won');
    playWin();

    const prev = loadBest();
    if (prev == null || seconds < prev) {
      saveBest(seconds);
      setMsg(`★ 遗迹被点亮！新纪录：用时 ${seconds} 秒 · ${moves} 步（理论最少 ${parMoves} 步）`, 'strong');
    } else {
      setMsg(`★ 遗迹被点亮！用时 ${seconds} 秒 · ${moves} 步（理论最少 ${parMoves} 步）· 最快 ${prev} 秒`, 'strong');
    }
    if (moves === parMoves) {
      msgEl.textContent += ' · ✦ 完美步数！';
    }
    updateBestDisplay();
    winSub.textContent = `用时 ${seconds} 秒 · ${moves} 步（理论最少 ${parMoves} 步）`;
    showWinOverlay();
  }

  // —— 最快记录（localStorage） ——
  function loadBest() {
    try {
      const v = JSON.parse(localStorage.getItem('lightsout_best') || 'null');
      return v == null ? null : v;
    } catch (e) { return null; }
  }
  function saveBest(t) {
    try { localStorage.setItem('lightsout_best', JSON.stringify(t)); } catch (e) {}
  }
  function updateBestDisplay() {
    const b = loadBest();
    bestLineEl.textContent = b == null ? '最快记录：暂无' : `最快记录：${b} 秒`;
  }

  function startTimer() {
    stopTimer();
    timerId = setInterval(() => {
      seconds++;
      timerEl.textContent = String(Math.min(999, seconds)).padStart(3, '0');
    }, 1000);
  }
  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function resetHud() {
    moves = 0;
    seconds = 0;
    gameOver = false;
    hintMode = 'off';
    stopTimer();
    clearHints();
    hintBtn.classList.remove('active');
    solveBtn.classList.remove('active');
    document.body.classList.remove('won');
    hideWinOverlay();
    resetBtn.textContent = '⟳';
    setMsg('');
    timerEl.textContent = '000';
    updateMoveCounter();
  }

  function startRandomGame() {
    setEditing(false);
    resetHud();
    const { st, mm } = randomState();
    state = st;
    parMoves = mm;
    renderAll();
    parLineEl.textContent = `本局最少 ${parMoves} 步可解`;
    updateBestDisplay();
    startTimer();
  }

  function enterSetup() {
    setEditing(true);
    resetHud();
    state = new Array(TOTAL).fill(false);
    parMoves = 0;
    customSetup = [];
    renderAll();
    parLineEl.textContent = '自定义：点击石砖设置太阳位置';
    updateSetupCount();
    updateBestDisplay();
  }

  function replayCustom() {
    setEditing(false);
    resetHud();
    state = customSetup.slice();
    parMoves = countOnes(computeSolution(state));
    renderAll();
    parLineEl.textContent = `本局最少 ${parMoves} 步可解`;
    startTimer();
  }

  function startFromSetup() {
    const front = countOnes(state);
    if (front === TOTAL) {
      setMsg('⚠ 已全部为太阳，请先设置成至少含 1 格月亮的局面', 'warn');
      return;
    }
    customSetup = state.slice();
    setEditing(false);
    resetHud();
    parMoves = countOnes(computeSolution(state));
    renderAll();
    parLineEl.textContent = `本局最少 ${parMoves} 步可解`;
    startTimer();
  }

  function switchMode(m) {
    mode = m;
    if (mode === 'custom') enterSetup();
    else startRandomGame();
  }

  // —— 事件 ——
  boardEl.addEventListener('click', (e) => {
    const el = e.target.closest('.cell');
    if (!el) return;
    const i = +el.dataset.i;
    if (editing) toggleEditCell(i);
    else toggleCell(i);
  });

  resetBtn.addEventListener('click', () => {
    if (mode === 'random') {
      startRandomGame();
    } else if (editing) {
      // 编辑态：清空编辑
      state = new Array(TOTAL).fill(false);
      renderAll();
      updateSetupCount();
    } else {
      replayCustom();
    }
  });

  hintBtn.addEventListener('click', () => {
    if (gameOver || editing) return;
    if (hintMode === 'one') {
      hintMode = 'off';
      hintBtn.classList.remove('active');
      clearHints();
      setMsg('');
    } else {
      hintMode = 'one';
      hintBtn.classList.add('active');
      solveBtn.classList.remove('active');
      updateHints();
    }
  });

  solveBtn.addEventListener('click', () => {
    if (gameOver || editing) return;
    if (hintMode === 'all') {
      hintMode = 'off';
      solveBtn.classList.remove('active');
      clearHints();
      setMsg('');
    } else {
      hintMode = 'all';
      solveBtn.classList.add('active');
      hintBtn.classList.remove('active');
      updateHints();
    }
  });

  clearBtn.addEventListener('click', () => {
    state = new Array(TOTAL).fill(false);
    renderAll();
    updateSetupCount();
  });

  randomizeBtn.addEventListener('click', () => {
    for (let i = 0; i < TOTAL; i++) state[i] = Math.random() < 0.5;
    if (countOnes(state) === TOTAL) {
      state[Math.floor(Math.random() * TOTAL)] = false; // 保证至少 1 格月亮
    }
    renderAll();
    updateSetupCount();
  });

  startBtn.addEventListener('click', startFromSetup);

  document.querySelectorAll('.mode button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      switchMode(btn.dataset.mode);
    });
  });

  // —— 主题切换（昼/夜） ——
  function applyTheme(theme) {
    document.body.classList.toggle('light', theme === 'light');
    themeBtn.textContent = theme === 'light' ? '夜' : '昼';
    themeBtn.title = theme === 'light' ? '切换到夜间遗迹' : '切换到昼间遗迹';
  }
  let theme = 'dark';
  try { theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
  applyTheme(theme);
  themeBtn.addEventListener('click', () => {
    theme = theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('theme', theme); } catch (e) {}
    applyTheme(theme);
  });

  // 砖块移动：播放嵌入的录音音效
  const brickSfx = document.getElementById('brickSfx');
  function playBrick() {
    if (!brickSfx) return;
    try {
      brickSfx.currentTime = 0;
      brickSfx.play();
    } catch (e) {}
  }

  // —— 胜利音效（Web Audio 合成，风铃上行琶音） ——
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function bell(freq, when, dur, vol) {
    const t = when;
    const o1 = audioCtx.createOscillator();
    o1.type = 'sine';
    o1.frequency.value = freq;
    const g1 = audioCtx.createGain();
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.linearRampToValueAtTime(vol || 0.22, t + 0.012);
    g1.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o1.connect(g1).connect(audioCtx.destination);
    o1.start(t);
    o1.stop(t + dur + 0.05);
    const o2 = audioCtx.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = freq * 2.76;
    const g2 = audioCtx.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.linearRampToValueAtTime((vol || 0.22) * 0.35, t + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.6);
    o2.connect(g2).connect(audioCtx.destination);
    o2.start(t);
    o2.stop(t + dur + 0.05);
  }
  function playWin() {
    ensureAudio();
    if (!audioCtx) return;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach((f, i) => bell(f, audioCtx.currentTime + i * 0.12, 0.7));
    bell(1318.5, audioCtx.currentTime + notes.length * 0.12, 0.9, 0.26); // E6 收尾
  }

  // —— 通关胜利界面 ——
  const winOverlay = document.getElementById('winOverlay');
  const winSub = document.getElementById('winSub');
  const winAgain = document.getElementById('winAgain');
  const winClose = document.getElementById('winClose');
  function showWinOverlay() { winOverlay.classList.remove('hidden'); }
  function hideWinOverlay() { winOverlay.classList.add('hidden'); }
  winAgain.addEventListener('click', () => {
    hideWinOverlay();
    if (mode === 'random') startRandomGame();
    else replayCustom();
  });
  winClose.addEventListener('click', hideWinOverlay);

  // 启动
  buildBoard();
  startRandomGame();
})();
</script>
</body>
</html>
